function decodePage(encoded){
  const binary=atob(encoded);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
const frame1=document.getElementById('frame1');
const frame2=document.getElementById('frame2');
frame1.srcdoc=decodePage(PAGE_1);
frame2.srcdoc=decodePage(PAGE_2);
function selectSet(which){
  const first=which===1;
  frame1.hidden=!first;
  frame2.hidden=first;
  document.getElementById('tab1').setAttribute('aria-selected',String(first));
  document.getElementById('tab2').setAttribute('aria-selected',String(!first));
  try{localStorage.setItem('vatli11-active-set',String(which));}catch(e){}
}
document.getElementById('tab1').addEventListener('click',()=>selectSet(1));
document.getElementById('tab2').addEventListener('click',()=>selectSet(2));
try{if(localStorage.getItem('vatli11-active-set')==='2')selectSet(2);}catch(e){}
</script>
