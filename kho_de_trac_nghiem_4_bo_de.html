<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b4e">
<title>Kho đề trắc nghiệm – Vật Lý & Tiếng Anh</title>
<style>
:root{--ink:#14243a;--muted:#627187;--line:#e2e8f0;--navy:#102b4e;--blue:#2463eb;--bg:#f3f6fb;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.topbar{background:linear-gradient(115deg,#102b4e,#1d4777);color:#fff;padding:26px 22px 30px}
.wrap{max-width:1100px;margin:0 auto}
.brand{font-size:12px;letter-spacing:.16em;font-weight:800;opacity:.78;text-transform:uppercase}
h1{font-size:clamp(25px,4vw,38px);line-height:1.15;margin:10px 0 8px}
.lead{margin:0;color:#d9e6f7;font-size:15px}
main{max-width:1100px;margin:0 auto;padding:28px 22px 48px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
.section-head h2{margin:0;font-size:20px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:190px;padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;box-shadow:0 5px 18px rgba(16,43,78,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#a9c3ef;box-shadow:0 12px 28px rgba(16,43,78,.1)}
.card-kicker{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--blue)}
.card-title{font-size:24px;font-weight:800;margin-top:12px}
.card-subtitle{font-size:14px;color:var(--muted);margin-top:5px}
.card-action{margin-top:auto;padding-top:20px;color:var(--blue);font-weight:750;font-size:14px}
.note{margin-top:20px;color:var(--muted);font-size:13px;line-height:1.6}
.viewer{display:none}
.viewer-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;color:var(--navy);cursor:pointer}
.current-title{font-weight:800;font-size:18px}
.frame-shell{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 22px rgba(16,43,78,.07)}
iframe{display:block;width:100%;height:calc(100vh - 190px);min-height:680px;border:0;background:#fff}
.footer{text-align:center;color:#8290a3;font-size:12px;margin-top:24px}
@media(max-width:640px){.grid{grid-template-columns:1fr}main{padding:22px 14px 36px}.topbar{padding:22px 16px 25px}iframe{height:calc(100vh - 190px);min-height:620px}.card{min-height:160px}}
</style>
</head>

  <div class="wrap">

    <h1>Trắc nghiệm Vật Lý & Tiếng Anh</h1>

  </div>
</header>

<button class="card" type="button" onclick="openQuiz('tienganh2')">

      <span class="card-action">Vào làm bài <span aria-hidden="true">→</span></span>

    </div>
    <p class="note">Mẹo: Trên điện thoại, xoay ngang màn hình nếu cần không gian làm bài rộng hơn.</p>
  </section>

  <section id="viewer" class="viewer">
    <div class="viewer-head">
      <button class="back" type="button" onclick="showHome()">← Danh sách bộ đề</button>
      <div id="currentTitle" class="current-title"></div>
    </div>
    <div class="frame-shell">
      <iframe id="quizFrame" title="Bài trắc nghiệm được chọn"></iframe>
    </div>
  </section>
  <div class="footer">Kho đề ôn tập • Một trang – bốn bộ đề</div>
</main>

function decodeHtml(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function openQuiz(key) {
  const quiz = quizzes[key];
  if (!quiz) return;
  document.getElementById("home").style.display = "none";
  document.getElementById("viewer").style.display = "block";
  document.getElementById("currentTitle").textContent = quiz.label;
  document.getElementById("quizFrame").srcdoc = decodeHtml(quiz.data);
  history.replaceState({quiz:key}, "", "#" + key);
  window.scrollTo({top:0, behavior:"smooth"});
}
function showHome() {
  document.getElementById("quizFrame").srcdoc = "";
  document.getElementById("viewer").style.display = "none";
  document.getElementById("home").style.display = "block";
  document.getElementById("currentTitle").textContent = "";
  history.replaceState({}, "", location.pathname + location.search);
  window.scrollTo({top:0, behavior:"smooth"});
}
window.addEventListener("DOMContentLoaded", () => {
  const key = location.hash.slice(1);
  if (quizzes[key]) openQuiz(key);
});
</script>
