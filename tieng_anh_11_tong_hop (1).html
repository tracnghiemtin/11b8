 impossible.", "I could not agree to the rule."], "c": 1, "e": ""}, {"p": "", "q": "A: “May I use your tablet for the research project?” B: “____”", "o": ["Yes, of course. Go ahead.", "Yes, it is certainly a tablet.", "I cannot help it.", "It looks modern."], "c": 0, "e": ""}, {"p": "", "q": "A: “Is it OK if I open the window?” B: “____”", "o": ["I doubt the weather is hot.", "Sure, no problem.", "I will open it last week.", "It is a window."], "c": 1, "e": ""}, {"p": "", "q": "A: “Do you mind if I borrow your bike?” B: “____”", "o": ["Not at all. Just bring it back by six.", "Yes, you are certainly correct.", "No, I am not a cyclist.", "You have borrowed it yesterday."], "c": 0, "e": ""}, {"p": "", "q": "A: “Can I leave the meeting early?” B: “____”", "o": ["I think the meeting is interesting.", "I am afraid you cannot; we need everyone until the end.", "It looks like a meeting.", "Thank you for offering."], "c": 1, "e": ""}, {"p": "", "q": "A: “Would it be all right if I took photos at the exhibition?” B: “____”", "o": ["Yes, you may, but please do not use flash.", "I hope the photos look nice yesterday.", "I can carry your camera.", "You must be a photographer."], "c": 0, "e": ""}, {"p": "", "q": "A: “Will future cities use more renewable energy?” B: “____”", "o": ["I am certain they will.", "You are welcome.", "May I borrow yours?", "No, thanks. I am fine."], "c": 0, "e": ""}, {"p": "", "q": "A: “Do you think flying taxis will be common soon?” B: “____”", "o": ["Please help yourself.", "I am not sure; they may be too expensive.", "Yes, you have my permission.", "Thanks for your support."], "c": 1, "e": ""}, {"p": "", "q": "A: “Are you sure this new transport system is eco-friendly?” B: “____”", "o": ["Yes, I am absolutely certain.", "Certainly, take my pen.", "You should see a doctor.", "I can help carry it."], "c": 0, "e": ""}, {"p": "", "q": "A: “Will robots replace all human workers in future cities?” B: “____”", "o": ["I would be happy to help.", "You must not use a robot.", "I doubt it; many jobs still need people.", "Of course you can."], "c": 2, "e": ""}, {"p": "", "q": "A: “Do you think the smart sensors will reduce traffic jams?” B: “____”", "o": ["I think they probably will.", "Yes, please help me.", "May I leave now?", "That is very kind of you."], "c": 0, "e": ""}]}, {"id": "de2_tonghop", "title": "Đề 2: Ngữ pháp và từ vựng tổng hợp", "note": "", "sq": true, "so": true, "items": [{"p": "", "q": "Eating a balanced _____ helps teenagers get enough nutrients for growth.", "o": ["diet", "screen", "conflict", "vehicle"], "c": 0, "e": "“Balanced diet” là cụm từ cố định: chế độ ăn cân bằng."}, {"p": "", "q": "My brother is keen _____ learning how smart transport systems work.", "o": ["at", "on", "to", "for"], "c": 1, "e": "Cấu trúc: be keen on + V-ing."}, {"p": "", "q": "Students should _____ regular exercise to stay fit.", "o": ["do", "make", "take", "put"], "c": 0, "e": "Cụm từ: do regular exercise."}, {"p": "", "q": "The city plans to _____ public transport to reduce traffic congestion.", "o": ["carry out", "improve", "put off", "take after"], "c": 1, "e": "Improve public transport = cải thiện giao thông công cộng."}, {"p": "", "q": "Minh: “Would you like me to explain how this health app works?” — Hoa: “_____”", "o": ["You must not use it.", "Yes, please. That would be very helpful.", "I am not sure who owns it.", "No, I did not go there yesterday."], "c": 1, "e": "Lời đáp chấp nhận đề nghị giúp đỡ một cách lịch sự."}, {"p": "", "q": "When my grandparents _____ teenagers, most families in their village lived together.", "o": ["are", "have been", "were", "will be"], "c": 2, "e": "Mệnh đề quá khứ “lived” đi cùng “were”."}, {"p": "", "q": "Our school _____ three health workshops so far this term.", "o": ["organised", "organises", "has organised", "was organising"], "c": 2, "e": "“So far this term” dùng thì hiện tại hoàn thành."}, {"p": "", "q": "Choose the sentence in which the bold verb functions as a linking verb.", "o": ["The runners reached the finish line.", "The soup tastes delicious.", "The students discussed the plan.", "The engineer tested the sensor."], "c": 1, "e": "“Tastes” nối chủ ngữ “the soup” với tính từ “delicious”, là linking verb."}, {"p": "", "q": "Choose the sentence closest in meaning to: “Lan started practising yoga four years ago, and she still practises it.”", "o": ["Lan has practised yoga for four years.", "Lan practised yoga four years ago and then stopped.", "Lan has practised yoga since four years.", "Lan is practising yoga for four years."], "c": 0, "e": "Hành động bắt đầu trong quá khứ và còn tiếp diễn: have/has + V3 + for + khoảng thời gian."}, {"p": "", "q": "Choose the sentence closest in meaning to: “The last time I visited my grandparents was in 2023.”", "o": ["I have visited my grandparents since 2023.", "I have not visited my grandparents since 2023.", "I did not visit my grandparents in 2023.", "I am not visiting my grandparents in 2023."], "c": 1, "e": "“The last time ... was in 2023” = “have not ... since 2023”."}, {"p": "", "q": "Students _____ respect other people’s opinions when discussing the generation gap.", "o": ["mustn’t", "shouldn’t", "should", "needn’t"], "c": 2, "e": "“Should” dùng để khuyên nên tôn trọng ý kiến người khác."}]}, {"id": "de2_dien", "title": "Đề 2: Đọc điền từ", "note": "", "sq": false, "so": false, "items": [{"p": "SMART LIVING OPEN DAY\nWould you like to explore healthier and greener ways of living? Join (20) _____ free workshop at our school this Saturday. Students will learn (21) _____ nutritious meals, stress management and technologies used in future cities. Local experts will demonstrate simple health-tracking tools and explain how smart buses can reduce pollution. There will also be an (22) _____ session on safe and responsible technology use.\nTime: 8:30–11:30 a.m. | Venue: School Hall | Admission: Free\nPlease register with your class teacher by Thursday. Bring a notebook and a refillable water bottle. Everyone is welcome!", "q": "Choose the best answer for blank (20).", "o": ["a", "an", "the", "Ø (no article)"], "c": 0, "e": "Danh từ đếm được số ít “workshop” nhắc đến lần đầu: a free workshop."}, {"p": "SMART LIVING OPEN DAY\nWould you like to explore healthier and greener ways of living? Join (20) _____ free workshop at our school this Saturday. Students will learn (21) _____ nutritious meals, stress management and technologies used in future cities. Local experts will demonstrate simple health-tracking tools and explain how smart buses can reduce pollution. There will also be an (22) _____ session on safe and responsible technology use.\nTime: 8:30–11:30 a.m. | Venue: School Hall | Admission: Free\nPlease register with your class teacher by Thursday. Bring a notebook and a refillable water bottle. Everyone is welcome!", "q": "Choose the best answer for blank (21).", "o": ["in", "for", "about", "with"], "c": 2, "e": "Learn about + chủ đề = tìm hiểu về..."}, {"p": "SMART LIVING OPEN DAY\nWould you like to explore healthier and greener ways of living? Join (20) _____ free workshop at our school this Saturday. Students will learn (21) _____ nutritious meals, stress management and technologies used in future cities. Local experts will demonstrate simple health-tracking tools and explain how smart buses can reduce pollution. There will also be an (22) _____ session on safe and responsible technology use.\nTime: 8:30–11:30 a.m. | Venue: School Hall | Admission: Free\nPlease register with your class teacher by Thursday. Bring a notebook and a refillable water bottle. Everyone is welcome!", "q": "Choose the best answer for blank (22).", "o": ["inform", "informative", "information", "informatively"], "c": 1, "e": "Sau “an” và trước “session” cần tính từ: informative."}, {"p": "STUDENT DIGITAL WELL-BEING WEEK\nOur school will hold Digital Well-being Week from 9 to 13 November. The activities aim to help students build healthy online habits and communicate respectfully across generations. Teachers encourage students (23) _____ their daily screen time and discuss healthy habits with family members. Remember to ask for (24) _____ before posting photographs of other people. Students can also (25) _____ part in a poster competition and a lunchtime discussion. All events are free, and no special equipment is required. Register at the Student Support Office before Friday. Participants will receive a certificate at the closing ceremony.", "q": "Choose the best answer for blank (23).", "o": ["tracking", "track", "to track", "tracked"], "c": 2, "e": "Encourage somebody to do something."}, {"p": "STUDENT DIGITAL WELL-BEING WEEK\nOur school will hold Digital Well-being Week from 9 to 13 November. The activities aim to help students build healthy online habits and communicate respectfully across generations. Teachers encourage students (23) _____ their daily screen time and discuss healthy habits with family members. Remember to ask for (24) _____ before posting photographs of other people. Students can also (25) _____ part in a poster competition and a lunchtime discussion. All events are free, and no special equipment is required. Register at the Student Support Office before Friday. Participants will receive a certificate at the closing ceremony.", "q": "Choose the best answer for blank (24).", "o": ["generation", "permission", "pollution", "nutrition"], "c": 1, "e": "Ask for permission = xin phép."}, {"p": "STUDENT DIGITAL WELL-BEING WEEK\nOur school will hold Digital Well-being Week from 9 to 13 November. The activities aim to help students build healthy online habits and communicate respectfully across generations. Teachers encourage students (23) _____ their daily screen time and discuss healthy habits with family members. Remember to ask for (24) _____ before posting photographs of other people. Students can also (25) _____ part in a poster competition and a lunchtime discussion. All events are free, and no special equipment is required. Register at the Student Support Office before Friday. Participants will receive a certificate at the closing ceremony.", "q": "Choose the best answer for blank (25).", "o": ["do", "make", "take", "give"], "c": 2, "e": "Take part in = tham gia."}, {"p": "OUR GREENER NEIGHBOURHOOD\nA student group has started a project called “Our Greener Neighbourhood”. Members noticed that the local park had fewer visitors because rubbish was often left near the benches. They suggested a monthly clean-up and invited nearby families to join. (26) _____, more people began using the park after the first event. Volunteers agreed to (27) _____ the young trees and report any damage to the local council. Working together also helped students develop a sense of (28) _____ for their shared environment. Since the programme began, organisers (29) _____ two recycling points and collected suggestions from residents. Older neighbours have shared practical ideas, while younger volunteers have helped create digital posters. The students now feel more (30) _____ about speaking to the community and making a difference. They hope the project will continue throughout the school year.", "q": "Choose the best answer for blank (26).", "o": ["However", "Therefore", "Although", "Unless"], "c": 1, "e": "“Therefore” liên kết nguyên nhân và kết quả."}, {"p": "OUR GREENER NEIGHBOURHOOD\nA student group has started a project called “Our Greener Neighbourhood”. Members noticed that the local park had fewer visitors because rubbish was often left near the benches. They suggested a monthly clean-up and invited nearby families to join. (26) _____, more people began using the park after the first event. Volunteers agreed to (27) _____ the young trees and report any damage to the local council. Working together also helped students develop a sense of (28) _____ for their shared environment. Since the programme began, organisers (29) _____ two recycling points and collected suggestions from residents. Older neighbours have shared practical ideas, while younger volunteers have helped create digital posters. The students now feel more (30) _____ about speaking to the community and making a difference. They hope the project will continue throughout the school year.", "q": "Choose the best answer for blank (27).", "o": ["give up", "look after", "put off", "turn down"], "c": 1, "e": "Look after the young trees = chăm sóc cây non."}, {"p": "OUR GREENER NEIGHBOURHOOD\nA student group has started a project called “Our Greener Neighbourhood”. Members noticed that the local park had fewer visitors because rubbish was often left near the benches. They suggested a monthly clean-up and invited nearby families to join. (26) _____, more people began using the park after the first event. Volunteers agreed to (27) _____ the young trees and report any damage to the local council. Working together also helped students develop a sense of (28) _____ for their shared environment. Since the programme began, organisers (29) _____ two recycling points and collected suggestions from residents. Older neighbours have shared practical ideas, while younger volunteers have helped create digital posters. The students now feel more (30) _____ about speaking to the community and making a difference. They hope the project will continue throughout the school year.", "q": "Choose the best answer for blank (28).", "o": ["responsible", "responsibility", "responsibly", "respond"], "c": 1, "e": "A sense of responsibility = ý thức trách nhiệm."}, {"p": "OUR GREENER NEIGHBOURHOOD\nA student group has started a project called “Our Greener Neighbourhood”. Members noticed that the local park had fewer visitors because rubbish was often left near the benches. They suggested a monthly clean-up and invited nearby families to join. (26) _____, more people began using the park after the first event. Volunteers agreed to (27) _____ the young trees and report any damage to the local council. Working together also helped students develop a sense of (28) _____ for their shared environment. Since the programme began, organisers (29) _____ two recycling points and collected suggestions from residents. Older neighbours have shared practical ideas, while younger volunteers have helped create digital posters. The students now feel more (30) _____ about speaking to the community and making a difference. They hope the project will continue throughout the school year.", "q": "Choose the best answer for blank (29).", "o": ["have introduced", "introduced", "introduce", "are introducing"], "c": 0, "e": "“Since the programme began” dùng hiện tại hoàn thành."}, {"p": "OUR GREENER NEIGHBOURHOOD\nA student group has started a project called “Our Greener Neighbourhood”. Members noticed that the local park had fewer visitors because rubbish was often left near the benches. They suggested a monthly clean-up and invited nearby families to join. (26) _____, more people began using the park after the first event. Volunteers agreed to (27) _____ the young trees and report any damage to the local council. Working together also helped students develop a sense of (28) _____ for their shared environment. Since the programme began, organisers (29) _____ two recycling points and collected suggestions from residents. Older neighbours have shared practical ideas, while younger volunteers have helped create digital posters. The students now feel more (30) _____ about speaking to the community and making a difference. They hope the project will continue throughout the school year.", "q": "Choose the best answer for blank (30).", "o": ["reluctant", "confident", "isolated", "impatient"], "c": 1, "e": "Feel more confident about + V-ing = tự tin hơn khi..."}]}, {"id": "de2_doc", "title": "Đề 2: Đọc hiểu", "note": "", "sq": false, "so": false, "items": [{"p": "SMART CITIES SHOULD WORK FOR EVERYONE\nWhen people imagine the city of the future, they often picture driverless buses, connected buildings and machines that complete everyday tasks. These inventions may be useful, but a successful city needs more than impressive technology. It must provide safe, healthy and convenient living conditions for residents of different ages. As urban populations grow, planners face the challenge of improving services while reducing harm to the environment. Good planning therefore starts by asking what people actually need.\n\nTransport is one area where technology can make a difference. Smart traffic lights can change their timing when the number of vehicles on a road rises or falls. Digital displays at bus stops can also give passengers reliable information about arrival times. These systems may help people travel more efficiently. However, cities still need safe pavements, cycle lanes and affordable public transport. If residents have practical alternatives to private cars, traffic congestion and air pollution may gradually decrease.\n\nGreen areas are another important part of city life. Trees offer shade, while parks give residents space to exercise, rest and meet friends. Shared gardens can also bring neighbours together through small projects such as planting vegetables. In some communities, young people help older residents with heavier tasks, and older residents share their knowledge of plants. Such activities can build connections between generations. Green areas may improve air quality, but their social benefits are just as valuable.\n\nModern cities must also address the problems created by digital systems. [I] Some services collect personal information, and residents may worry about how it is stored. [II] Others, especially people who have little experience with technology, may find online services difficult to use. [III] City authorities should provide clear instructions, protect private data and maintain other ways of accessing important services. [IV] They should also invite residents to express their opinions before making major changes.\n\nIn the end, the best smart city is not necessarily the one with the most machines. It is a place where useful technology works alongside green spaces, accessible transport and thoughtful public decisions. If planners listen to people and act responsibly, cities can become both more sustainable and more enjoyable places to live.", "q": "The word “reliable” in paragraph 2 is CLOSEST in meaning to _____.", "o": ["dependable", "expensive", "temporary", "complicated"], "c": 0, "e": "Reliable = dependable = đáng tin cậy."}, {"p": "SMART CITIES SHOULD WORK FOR EVERYONE\nWhen people imagine the city of the future, they often picture driverless buses, connected buildings and machines that complete everyday tasks. These inventions may be useful, but a successful city needs more than impressive technology. It must provide safe, healthy and convenient living conditions for residents of different ages. As urban populations grow, planners face the challenge of improving services while reducing harm to the environment. Good planning therefore starts by asking what people actually need.\n\nTransport is one area where technology can make a difference. Smart traffic lights can change their timing when the number of vehicles on a road rises or falls. Digital displays at bus stops can also give passengers reliable information about arrival times. These systems may help people travel more efficiently. However, cities still need safe pavements, cycle lanes and affordable public transport. If residents have practical alternatives to private cars, traffic congestion and air pollution may gradually decrease.\n\nGreen areas are another important part of city life. Trees offer shade, while parks give residents space to exercise, rest and meet friends. Shared gardens can also bring neighbours together through small projects such as planting vegetables. In some communities, young people help older residents with heavier tasks, and older residents share their knowledge of plants. Such activities can build connections between generations. Green so give passengers reliable information about arrival times. These systems may help people travel more efficiently. However, cities still need safe pavements, cycle lanes and affordable public transport. If residents have practical alternatives to private cars, traffic congestion and air pollution may gradually decrease.\n\nGreen areas are another important part of city life. Trees offer shade, while parks give residents space to exercise, rest and meet friends. Shared gardens can also bring neighbours together through small projects such as planting vegetables. In some communities, young people help older residents with heavier tasks, and older residents share their knowledge of plants. Such activities can build connections between generations. Green areas may improve air quality, but their social benefits are just as valuable.\n\nModern cities must also address the problems created by digital systems. [I] Some services collect personal information, and residents may worry about how it is stored. [II] Others, especially people who have little experience with technology, may find online services difficult to use. [III] City authorities should provide clear instructions, protect private data and maintain other ways of accessing important services. [IV] They should also invite residents to express their opinions before making major changes.\n\nIn the end, the best smart city is not necessarily the one with the most machines. It is a place where useful technology works alongside green spaces, accessible transport and thoughtful public decisions. If planners listen to people and act responsibly, cities can become both more sustainable and more enjoyable places to live.", "q": "Which of the following is NOT implied by paragraph 3?", "o": ["Some shared spaces can encourage neighbours to meet.", "Green spaces may benefit residents’ health.", "Planting trees alone can solve all social problems.", "City design should consider both nature and community life."], "c": 2, "e": " const L=["A","B","C","D"],KEY="tn11_best";
const $app=document.getElementById("app");
let Q=[],ans=[],done=false,cur=null;
function best(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
function setBest(id,s,n){try{const b=best();if(!b[id]||s>b[id].s)b[id]={s,n};localStorage.setItem(KEY,JSON.stringify(b))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function menu(){
  cur=null;$app.innerHTML="";
  const h=el("header");h.append(el("h1",null,"Ôn tập Tiếng Anh 11"),el("p",null,"Chọn một bài để làm. Tổng cộng "+SECS.reduce((n,s)=>n+s.items.length,0)+" câu."));
  const m=el("div","menu"),b=best();
  SECS.forEach(s=>{
    const btn=el("button","sec");const d=el("div");
    d.append(el("strong",null,s.title),el("small",null,s.items.length+" câu"+(s.note?" · "+s.note:"")));
    btn.append(d);
    if(b[s.id])btn.append(el("span","best","Cao nhất: "+b[s.id].s+"/"+b[s.id].n));
    btn.onclick=()=>open(s);m.append(btn)});
  $app.append(h,m);window.scrollTo(0,0)}
function open(s){
  cur=s;done=false;
  Q=s.sq?shuffle(s.items):s.items.slice();
  Q=Q.map(it=>{if(!s.so)return it;const idx=shuffle(it.o.map((t,i)=>i));return{...it,o:idx.map(i=>it.o[i]),c:idx.indexOf(it.c)}});
  ans=Q.map(()=>-1);draw();window.scrollTo(0,0)}
function draw(){
  const s=cur;$app.innerHTML="";
  const back=el("button","btn alt","Về danh sách bài");back.onclick=menu;
  const bar=el("div","bar");const cnt=el("span",null,"");cnt.id="cnt";const tr=el("div","track");const f=el("div","fill");f.id="fill";tr.append(f);bar.append(back,cnt,tr);
  $app.append(bar,el("h2",null,s.title));
  if(s.sq)$app.append(el("p","note","Chọn đáp án là có kết quả ngay. Thứ tự câu và đáp án được xáo ngẫu nhiên mỗi lần làm."));
  Q.forEach((it,i)=>{
    if(it.p&&(i===0||Q[i-1].p!==it.p))$app.append(el("div","passage",it.p));
    const card=el("section","q");card.id="q"+i;
    const qt=el("p","qt");qt.append(el("span","qn","Câu "+(i+1)+"."),document.createTextNode(it.q));
    const ops=el("div","opts");
    it.o.forEach((t,k)=>{const o=el("button","opt");o.dataset.k=k;o.append(el("b",null,L[k]),el("span",null,t));
      o.onclick=()=>{if(done||ans[i]>=0)return;ans[i]=k;reveal(i);upd();if(ans.every(a=>a>=0))finish()};ops.append(o)});
    const fb=el("div","fb");fb.id="fb"+i;card.append(qt,ops,fb);$app.append(card)});
  const res=el("div");res.id="result";
  const act=el("div","actions");
  const sub=el("button","btn","Xem kết quả");sub.id="submit";sub.onclick=submit;
  const redo=el("button","btn alt","Làm lại bài này");redo.onclick=()=>open(cur);
  act.append(sub,redo);$app.append(res,act);upd()}
function reveal(i){
  const q=Q[i];
  document.querySelectorAll("#q"+i+" .opt").forEach(o=>{const k=+o.dataset.k;if(k===q.c)o.classList.add("ok");else if(k===ans[i])o.classList.add("no")});
  const fb=document.getElementById("fb"+i);fb.textContent="";
  fb.append(el("strong",null,(ans[i]===q.c?"Đúng. ":ans[i]<0?"Chưa làm. ":"Sai. ")),document.createTextNode("Đáp án: "),el("strong",null,q.o[q.c]),document.createTextNode(q.e?" · "+q.e:""))}
function upd(){const n=ans.filter(a=>a>=0).length,r=ans.filter((a,i)=>a===Q[i].c).length;document.getElementById("cnt").textContent=n+"/"+Q.length+" · đúng "+r;document.getElementById("fill").style.width=(n/Q.length*100)+"%"}
function submit(){
  if(done)return;
  const blank=ans.filter(a=>a<0).length;
  if(blank&&!confirm("Còn "+blank+" câu chưa làm. Vẫn xem kết quả?"))return;
  finish()}
function finish(){
  if(done)return;done=true;let score=0;
  Q.forEach((q,i)=>{if(ans[i]<0)reveal(i);if(ans[i]===q.c)score++});
  document.getElementById("submit").disabled=true;setBest(cur.id,score,Q.length);
  const r=document.getElementById("result");r.innerHTML="";
  const box=el("div","res");box.append(el("h3",null,score+"/"+Q.length+" câu đúng"),el("div",null,"Điểm: "+(score/Q.length*10).toFixed(1)+"/10"));r.append(box);
  box.scrollIntoView({behavior:"smooth"})}
menu();
</script></body></html>
