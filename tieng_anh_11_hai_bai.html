use. [III] City authorities should provide clear instructions, protect private data and maintain other ways of accessing important services. [IV] They should also invite residents to express their opinions before making major changes.\\n\\nIn the end, the best smart city is not necessarily the one with the most machines. It is a place where useful technology works alongside green spaces, accessible transport and thoughtful public decisions. If planners listen to people and act responsibly, cities can become both more sustainable and more enjoyable places to live.\",\"kind\":\"mc\"},{\"id\":\"T1\",\"section\":\"T\u1eeb v\u1ef1ng\",\"original\":1,\"question\":\"Doctors recommend following a _____ diet that provides the body with all the essential nutrients it needs.\",\"options\":[\"repetitive\",\"infectious\",\"balanced\",\"physical\"],\"correct\":2,\"why\":\"Balanced diet = ch\u1ebf \u0111\u1ed9 \u0103n c\u00e2n b\u1eb1ng.\",\"passage\":\"\",\"kind\":\"mc\"},{\"id\":\"T2\",\"section\":\"T\u1eeb v\u1ef1ng\",\"original\":2,\"question\":\"Regular exercise can strengthen your muscles and improve your overall physical _____.\",\"options\":[\"fitness\",\"treatment\",\"ingredient\",\"infection\"],\"correct\":0,\"why\":\"Physical fitness = th\u1ec3 l\u1ef1c.\",\"passage\":\"\",\"kind\":\"mc\"},{\"id\":\"T3\",\"section\":\"T\u1eeb v\u1ef1ng\",\"original\":3,\"question\":\"Eating too much processed food and staying up late are unhealthy _____ that may increase the risk of developing serious diseases.\",\"options\":[\"routines\",\"activities\",\"recipes\",\"habits\"],\"correct\":3,\"why\":\"Unhealthy habits = th\u00f3i quen kh\u00f4ng l\u00e0nh m\u1ea1nh.\",\"passage\":\"\",\"kind\":\"mc\"},{\"id\":\"T4\",\"section\":\"T\u1eeb v\u1ef1ng\",\"original\":4,\"question\":\"Scientists believe that improvements in healthcare and nutrition have contributed to a significant increase in life _____.\",\"options\":[\"treatment\",\"expectancy\",\"examination\",\"repetition\"],\"correct\":1 bled':''} type=\"button\">\u2190 C\u00e2u tr\u01b0\u1edbc<\/button><div style=\"display:flex;gap:8px;flex-wrap:wrap\">${state.index<tot-1?'<button class=\"btn primary\" id=\"next\" type=\"button\">C\u00e2u ti\u1ebfp \u2192<\/button>':'<button class=\"btn primary\" id=\"finish\" type=\"button\">N\u1ed9p b\u00e0i \u2713<\/button>'}<\/div><\/div><\/div><div class=\"actions\"><button class=\"btn ghost\" id=\"goHome\" type=\"button\">\u2190 Trang ch\u1ee7<\/button><button class=\"btn outline\" id=\"quickFinish\" type=\"button\">N\u1ed9p b\u00e0i ngay<\/button><\/div><\/div>\n <aside class=\"card side\"><h3 class=\"h2\" style=\"font-size:16px\">\u0110i t\u1edbi c\u00e2u<\/h3><p class=\"sub\" style=\"margin-bottom:0\">Ch\u1ecdn s\u1ed1 \u0111\u1ec3 chuy\u1ec3n c\u00e2u<\/p><div class=\"grid\">${state.items.map((it,i)=>`<button type=\"button\" class=\"num ${i===state.index?'current':''} ${it.chosen!==null?'answered':''}\" data-jump=\"${i}\">${i+1}<\/button>`).join('')}<\/div><div class=\"sideinfo\"><div>\u0110\u00e3 tr\u1ea3 l\u1eddi <b>${n}/${tot}<\/b><\/div><div>Ch\u01b0a l\u00e0m <b>${tot-n}<\/b><\/div><div>Ch\u1ebf \u0111\u1ed9 <b>${practice?'Luy\u1ec7n t\u1eadp':'Thi th\u1eed'}<\/b><\/div><\/div><p class=\"note\" style=\"margin:16px 0 0\">${practice?'M\u1ed7i c\u00e2u \u0111\u01b0\u1ee3c ch\u1ea5m ngay khi ch\u1ecdn.':'\u0110\u00e1p \u00e1n \u0111\u01b0\u1ee3c gi\u1ea5u \u0111\u1ebfn khi n\u1ed9p b\u00e0i.'}<\/p><\/aside><\/div>`;\n document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>selectAnswer(Number(b.dataset.opt)));\n document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>navigate(Number(b.dataset.jump)));\n byId('prev').onclick=()=>navigate(state.index-1);if(byId('next'))byId('next').onclick=()=>navigate(state.index+1);\n if(byId('finish'))byId('finish').onclick=submit;byId('quickFinish').onclick=submit;\n byId('goHome').onclick=()=>{show('home');home()};}\nfunction selectAnswer(opt){const item=state.items[state.index];if(state.config.mode==='practice'&&item.chosen!==null)return;item.chosen=opt;persist();renderQuiz()}\nfunction navigate(i){if(i<0||i>=state.items.length)return;state.index=i;persist();renderQuiz()}\nfunction submit(){const missing=state.items.length-selectedTotal();if(missing&&!confirm(`B\u1ea1n c\u00f2n ${missing} c\u00e2u ch\u01b0a ch\u1ecdn \u0111\u00e1p \u00e1n. V\u1eabn n\u1ed9p b\u00e0i ch\u1ee9?`))return;state.finishedAt=Date.now();persist();renderResult()}\nfunction renderResult(){if(!state)return home();show('result');const tot=state.items.length,correct=state.items.filter(isCorrect).length,wrong=state.items.filter(it=>it.chosen!==null&&!isCorrect(it)).length,skip=tot-correct-wrong,pct=Math.round(correct/tot*100);\n byId('result').innerHTML=`<div class=\"card\"><div class=\"result-head\"><div class=\"score\"><b>${pct}%<\/b><span>\u0110I\u1ec2M \u0110\u1ea0T<\/span><\/div><div><div class=\"eyebrow\" style=\"color:#6553cc\">K\u1ebeT QU\u1ea2 B\u00c0I L\u00c0M<\/div><h2 class=\"h2\" style=\"font-size:29px;margin-top:5px\">${pct===100?'Xu\u1ea5t s\u1eafc!':pct>=80?'L\u00e0m t\u1ed1t l\u1eafm!':pct>=50?'Ti\u1ebfp t\u1ee5c luy\u1ec7n t\u1eadp nh\u00e9!':'C\u00f9ng \u00f4n l\u1ea1i nh\u1eefng c\u00e2u sai nh\u00e9!'}<\/h2><p class=\"sub\" style=\"margin-bottom:0\">${esc(state.config.mode==='exam'?'Thi th\u1eed':'Luy\u1ec7n t\u1eadp')} \u2022 ${tot} c\u00e2u \u2022 Th\u1eddi gian ${elapsed()}<\/p><div class=\"result-stats\"><div class=\"stat\">\u0110\u00fang<b style=\"color:var(--good)\">${correct}<\/b><\/div><div class=\"stat\">Sai<b style=\"color:var(--bad)\">${wrong}<\/b><\/div><div class=\"stat\">B\u1ecf tr\u1ed1ng<b>${skip}<\/b><\/div><div class=\"stat\">Thang 10<b>${(correct/tot*10).toFixed(1)}<\/b><\/div><\/div><\/div><\/div><div class=\"actions\"><button type=\"button\" id=\"again\" class=\"btn primary\">\ud83d\udd00 \u0110\u1ea3o \u0111\u1ec1 v\u00e0 l\u00e0m l\u1ea1i<\/button><button type=\"button\" id=\"retry\" class=\"btn outline\" ${wrong+skip===0?'disabled':''}>\u00d4n ${wrong+skip} c\u00e2u sai / b\u1ecf tr\u1ed1ng<\/button><button type=\"button\" id=\"backHome\" class=\"btn ghost\">T\u1ea1o \u0111\u1ec1 m\u1edbi<\/button><\/div><\/div>\n <div class=\"card\"><h2 class=\"h2\">Xem l\u1ea1i \u0111\u00e1p \u00e1n<\/h2><p class=\"sub\">M\u1edf t\u1eebng c\u00e2u \u0111\u1ec3 xem n\u1ed9i dung g\u1ed1c, l\u1ef1a ch\u1ecdn c\u1ee7a b\u1ea1n v\u00e0 \u0111\u00e1p \u00e1n ch\u00ednh x\u00e1c.<\/p>${state.items.map((it,i)=>{const q=getQ(it),ok=isCorrect(it),status=it.chosen===null?'skip':ok?'ok':'fail',statusText=it.chosen===null?'B\u1ecf tr\u1ed1ng':ok?'\u0110\u00fang':'Sai';return `<details class=\"review ${status}\"><summary><span class=\"rk\">${status==='ok'?'\u2713':status==='fail'?'\u2715':'\u2013'} ${statusText}<\/span><span class=\"rt\">C\u00e2u ${i+1} \u00b7 ${esc(q.section)} \u00b7 G\u1ed1c ${q.number}<\/span><span>\u2304<\/span><\/summary><div class=\"review-body\"><p><b>${esc(q.question)}<\/b><\/p><div>\u270e B\u1ea1n ch\u1ecdn: <b>${it.chosen===null?'Ch\u01b0a tr\u1ea3 l\u1eddi':esc(q.answers[it.chosen])}<\/b><\/div><div style=\"color:var(--good);margin-top:5px\">\u2713 \u0110\u00e1p \u00e1n \u0111\u00fang: <b>${LETTERS[it.options.indexOf(q.correct)]}. ${esc(q.answers[q.correct])}<\/b><\/div><\/div><\/details>`}).join('')}<\/div>`;\n byId('again').onclick=()=>begin(state.config);byId('retry').onclick=()=>{const ids=state.items.filter(it=>!isCorrect(it)).map(x=>x.id);if(ids.length)begin({...state.config,limit:'all',shuffleQ:true},ids)};byId('backHome').onclick=()=>{state=null;try{localStorage.removeItem(STORAGE)}catch(e){};home();show('home')};}\nwindow.addEventListener('keydown',e=>{if(!state||state.finishedAt||byId('quiz').classList.contains('hidden'))return;if(e.target.closest('input,textarea,select'))return;let v=null;if('1234'.includes(e.key)&&e.key.length===1){v=state.items[state.index].options[Number(e.key)-1];e.preventDefault();selectAnswer(v)}else if(e.key==='ArrowRight'){e.preventDefault();navigate(Math.min(state.index
